name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Appli (typage, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Le fichier package-lock.json est créé par scripts/setup.sh : le versionner.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  server:
    name: Serveur (typage, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Image du serveur
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t vocourse-server:ci .
